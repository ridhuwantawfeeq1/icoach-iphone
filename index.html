<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="iCoach">
<title>iCoach Cricket Controller</title>
<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:#f3f6f8;font:16px -apple-system,BlinkMacSystemFont,sans-serif;padding:18px;padding-bottom:40px}
.wrap{max-width:480px;margin:auto}
.header{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:800;color:#8be28b}
.card{background:#1c2935;border:1px solid #344655;border-radius:18px;padding:18px;margin-top:16px}
.status{color:#ffc56a;font-weight:700}
.btn{border:0;border-radius:12px;background:#8be28b;color:#101820;padding:14px;font-weight:700;font-size:16px;width:100%;margin-top:10px}
.secondary{background:#344655;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.label{color:#9db0be;font-size:13px}
.val{font-size:28px;font-weight:700;margin:8px 0}
input[type=range]{width:100%;accent-color:#8be28b}
select{width:100%;padding:12px;border-radius:10px;background:#101820;color:white;border:1px solid #455968;margin-top:8px}
small{color:#9db0be;line-height:1.5}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
</style>
</head>

<body>
<div class="wrap">

<div class="header">
<div class="logo">iCoach Cricket</div>
<div class="status" id="status">● Checking Wi-Fi</div>
</div>

<div class="card">
<h2>Machine connection</h2>
<p class="label">Connect your iPhone to the cricket machine Wi-Fi first.</p>
<button class="btn" onclick="connectionInfo()">Connection help</button>
<small id="connectHelp"></small>
</div>

<div class="card">
<h2>Speed control</h2>
<div class="row">
<span class="label">Speed</span>
<span class="val"><span id="speed">50</span>%</span>
</div>
<input type="range" min="0" max="100" value="50" oninput="document.getElementById('speed').textContent=this.value">
<div class="grid">
<button class="btn secondary" onclick="speedStep(-5)">− 5</button>
<button class="btn secondary" onclick="speedStep(5)">+ 5</button>
</div>
</div>

<div class="card">
<h2>Ball / mode</h2>
<label class="label">Mode</label>
<select id="mode">
<option>Practice</option>
<option>Random</option>
<option>Spin</option>
<option>Fast</option>
<option>Custom</option>
</select>

<label class="label" style="display:block;margin-top:14px">Line</label>
<select>
<option>Centre</option>
<option>Off stump</option>
<option>Leg stump</option>
<option>Wide</option>
</select>

<label class="label" style="display:block;margin-top:14px">Length</label>
<select>
<option>Good length</option>
<option>Yorker</option>
<option>Short</option>
<option>Full</option>
</select>
</div>

<div class="card">
<h2>Controls</h2>
<button class="btn" onclick="alert('Machine connection is not yet implemented.')">Start</button>
<button class="btn secondary" onclick="alert('Machine connection is not yet implemented.')">Stop</button>
<small>Interface only. Machine control is not yet connected.</small>
</div>

</div>

<script>
function speedStep(n){
let r=document.querySelector('input[type=range]');
r.value=Math.min(100,Math.max(0,+r.value+n));
document.getElementById('speed').textContent=r.value;
}
function connectionInfo(){
document.getElementById('connectHelp').textContent=
'Connect to the iWinner machine Wi-Fi in iPhone Settings. Machine communication is not yet implemented.';
}
  unction checkWiFiStatus(){
  const status = document.getElementById("status");
  if(navigator.onLine){
    status.textContent = "● Network available";
  }else{
    status.textContent = "● Offline";
  }
}
window.addEventListener("online", checkWiFiStatus);
window.addEventListener("offline", checkWiFiStatus);
checkWiFiStatus();
</script>

</body>
</html>
